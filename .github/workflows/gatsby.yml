name: Build and Deploy Gatsby site to AWS S3

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: build-and-deploy-to-aws-s3-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies from the committed lockfile
        run: corepack yarn install --frozen-lockfile --non-interactive
      - name: Validate security compatibility
        run: corepack yarn run test:security
      - name: Validate CloudFront compression safeguards
        run: node --test tests/cloudfront-compression.test.cjs
      - name: Validate CloudFront CSP safeguards
        run: node --test tests/cloudfront-security.test.cjs
      - name: Build with Gatsby
        env:
          PREFIX_PATHS: 'true'
          GATSBY_TELEMETRY_DISABLED: '1'
        run: corepack yarn run build
      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Configure CloudFront compression
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/configure-cloudfront-compression.cjs --apply
      - name: Configure observed analytics CSP connections
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: node scripts/configure-cloudfront-security.cjs --apply
      - name: Deploy Gatsby to AWS S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: jonelantha/gatsby-s3-action@08b1e5dc1df5022aa5c416355788d0294a232f44 # v4, Node 24
        with:
          dest-s3-bucket: pradyumnashome.com
          browser-cache-duration: 7890000
          cdn-cache-duration: 7890000
          cloudfront-id-to-invalidate: E2GNF2ZJTU2DX5
